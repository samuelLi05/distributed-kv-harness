[package]
name = "distributed-kv-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A durable KV experiment harness with replaceable coordination"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
